name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - run: npm audit --audit-level=high
      - name: Compile Azure infrastructure
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/auth.bicep --stdout > /dev/null
      - name: Generate CycloneDX dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: application-sbom
          path: sbom.cdx.json
          retention-days: 90

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable production image
        run: docker build --pull=false --tag fabric-portal:security-scan .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fabric-portal:security-scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
